openapi: 3.1.0
info:
  title: Jinlian GYC API
  version: 4.3.0
  description: |
    金链·GYC 最新接口规范。
    当前版本关键约束：
    - UID 是业务主标识
    - 充值创建后自动到账，无人工审核
    - 提现仅交易时间可发起，提交即冻结并扣减暂定资产/总资产，确认完成不得二次扣款
    - 后台支持手工转账/补款，实时改账并保留 ledger/audit/hash 留痕
    - 交易支持买入和卖出，自动撮合
    - 交易时段自动同步上金所官方开休盘，无需人工配置固定时段
    - 撮合规则必须写入代码，遵循价格优先、时间优先
    - 哈希使用 SHA-256，输出固定 64 位，并同步半公开金链
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
  - name: AppAssets
  - name: AppRecharge
  - name: AppWithdraw
  - name: AppTrade
  - name: AppPayment
  - name: AppMarket
  - name: AppNotice
  - name: AdminDashboard
  - name: AdminUsers
  - name: AdminFunds
  - name: AdminPayments
  - name: AdminTrades
  - name: AdminLeaderboard
  - name: AdminSecurity
  - name: AdminRisk
  - name: AdminAudit
  - name: AdminReports
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 用户注册并分配 UID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegister'
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
  /app/assets/overview:
    get:
      tags: [AppAssets]
      summary: 获取用户资产总览
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssetOverview'
  /app/recharges:
    post:
      tags: [AppRecharge]
      summary: 创建充值订单并自动到账
      description: 创建成功后同事务写入资产、资金流水、审计日志和哈希记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRechargeOrder'
    get:
      tags: [AppRecharge]
      summary: 查询充值记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRechargeOrderList'
  /app/withdrawals:
    post:
      tags: [AppWithdraw]
      summary: 发起提现申请
      description: 仅交易时间可发起，提交后立即冻结金额并扣减暂定资产/总资产，进入按提交时间排序的提现队列
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithdrawOrder'
    get:
      tags: [AppWithdraw]
      summary: 查询提现记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithdrawOrderList'
  /app/trades/buy:
    post:
      tags: [AppTrade]
      summary: 提交买单并实时撮合
      description: |
        买单真实落库并在事务内执行撮合。
        撮合规则为价格优先、时间优先；用户被冻结或当前非交易时段/停盘时会直接拦截。
        支持通过请求头 `Idempotency-Key` 或请求体 `clientRequestId` 实现幂等提交；相同键重复请求会返回同一业务结果，处理中重复请求返回 409。
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: 幂等键。优先级高于 `clientRequestId`，同键同请求只允许成功落单一次。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTradeOrder'
        '409':
          description: 幂等键冲突或订单仍在处理中，请勿重复提交
  /app/trades/sell:
    post:
      tags: [AppTrade]
      summary: 提交卖单并实时撮合
      description: |
        卖单真实落库并在事务内执行撮合。
        撮合规则为价格优先、时间优先；用户被冻结或当前非交易时段/停盘时会直接拦截。
        支持通过请求头 `Idempotency-Key` 或请求体 `clientRequestId` 实现幂等提交；相同键重复请求会返回同一业务结果，处理中重复请求返回 409。
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: 幂等键。优先级高于 `clientRequestId`，同键同请求只允许成功落单一次。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTradeOrder'
        '409':
          description: 幂等键冲突或订单仍在处理中，请勿重复提交
  /app/trades:
    get:
      tags: [AppTrade]
      summary: 查询交易记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTradeOrderList'
  /app/payments/qr:
    get:
      tags: [AppPayment]
      summary: 获取收款二维码数据
      description: 返回收款二维码 payload 与固定文案“金链·GYC  法币锚定金银结算系统。”
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentQr'
  /app/payments/transfer:
    post:
      tags: [AppPayment]
      summary: 发起增值收益支付
      description: |
        仅允许使用 appreciationIncome 支付，不允许动用 cashAsset 或 tentativeAsset。
        支付成功后付款方 appreciationIncome/totalAsset 下降，收款方 appreciationIncome/totalAsset 上升。
        支持通过请求头 `Idempotency-Key` 或请求体 `clientRequestId` 幂等提交。
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentTransfer'
        '409':
          description: 支付处理中，请勿重复提交
  /app/payments/records:
    get:
      tags: [AppPayment]
      summary: 查询支付与收款记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentRecords'
  /app/market/au9999/ticker:
    get:
      tags: [AppMarket]
      summary: 获取上金所 AU9999 实时行情
      description: |
        优先从实时行情 provider 获取 AU9999 价格，失败时按 system_config 缓存、最新成交价、本地默认值逐级降级。
        返回 source、timestamp、refreshSeconds，价格精度固定为 0.01 元/克。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuTicker'
  /app/notices:
    get:
      tags: [AppNotice]
      summary: 获取首页公告轮播
      description: 前端按轮巡方式展示
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNoticeList'
  /admin/dashboard/overview:
    get:
      tags: [AdminDashboard]
      summary: 获取仪表盘总览
      description: 包含提现语音提醒中的订单数量
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDashboardOverview'
  /admin/dashboard/notices:
    post:
      tags: [AdminDashboard]
      summary: 发布公告
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNotice'
  /admin/funds/recharges:
    get:
      tags: [AdminFunds]
      summary: 查询充值对账列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRechargeOrderList'
  /admin/funds:
    get:
      tags: [AdminFunds]
      summary: 查询后台资金聚合面板
      responses:
        '200':
          description: OK
  /admin/funds/withdrawals:
    get:
      tags: [AdminFunds]
      summary: 查询提现审核列表
      description: 按提交时间升序返回，确保队列顺序稳定；新单默认触发语音持续提醒
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithdrawOrderList'
  /admin/funds/withdrawals/{orderId}/approve:
    post:
      tags: [AdminFunds]
      summary: 提现审核通过并进入转账处理中
      description: 同一订单只允许成功处理一次；重复点击会返回已处理结果或 409 冲突，并保留审计留痕。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithdrawOrder'
        '409':
          description: 提现审核处理中或订单状态已变化
  /admin/funds/withdrawals/{orderId}/mute-alert:
    post:
      tags: [AdminFunds]
      summary: 停止提现语音提醒
      description: 工作人员进入订单详情或手动静音时调用
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithdrawOrder'
  /admin/funds/withdrawals/{orderId}/reject:
    post:
      tags: [AdminFunds]
      summary: 驳回提现并解冻回补资产
      description: 同一订单只允许成功驳回一次；重复点击会返回已处理结果或 409 冲突，并在事务内完成回补与留痕。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithdrawOrder'
        '409':
          description: 提现驳回处理中或订单状态已变化
  /admin/funds/withdrawals/{orderId}/confirm-completed:
    post:
      tags: [AdminFunds]
      summary: 线下转账后确认提现完成
      description: 只允许更新订单为 completed，不允许二次扣减资产；重复点击会返回已处理结果或 409 冲突。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithdrawOrder'
        '409':
          description: 提现完成确认处理中或订单状态已变化
  /admin/funds/manual-transfer:
    post:
      tags: [AdminFunds]
      summary: 后台手工转账
      description: 实时调整 tentativeAsset 和 totalAsset，并同步写入 ledger、audit、hash；需要手工转账权限。支持 `Idempotency-Key` 防止后台双击重复记账。
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: 幂等键。相同键的重复请求只允许一次成功入账，其余返回已处理结果或 409。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseManualFundAction'
        '409':
          description: 资金调整处理中或余额状态已变化
  /admin/funds/manual-adjust:
    post:
      tags: [AdminFunds]
      summary: 后台手工补款/冲正
      description: 实时调整 tentativeAsset 和 totalAsset，并同步写入 ledger、audit、hash；需要手工补款权限。支持 `Idempotency-Key` 防止后台双击重复记账。
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: 幂等键。相同键的重复请求只允许一次成功入账，其余返回已处理结果或 409。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseManualFundAction'
        '409':
          description: 资金调整处理中或余额状态已变化
  /admin/payments:
    get:
      tags: [AdminPayments]
      summary: 查询支付订单列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminPaymentList'
  /admin/payments/overview:
    get:
      tags: [AdminPayments]
      summary: 查询支付总览
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminPaymentOverview'
  /admin/trades:
    get:
      tags: [AdminTrades]
      summary: 查询交易列表
      description: 前后台交易数据需实时同步，资产变动一秒更新；非上金所交易时段自动禁止撮合
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTradeOrderList'
  /admin/trades/session-status:
    get:
      tags: [AdminTrades]
      summary: 查询上金所交易时段同步状态
      description: 只读状态接口，交易时段由系统自动同步，无人工配置入口
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTradeSessionStatus'
  /admin/leaderboard:
    get:
      tags: [AdminLeaderboard]
      summary: 查询排行榜治理面板
      description: |
        返回排行榜快照列表与同步监控信息。
        支持按黄金克数或总资产排序，同值时按 UID 升序保持稳定顺序。
      responses:
        '200':
          description: OK
  /admin/security/admin-users:
    get:
      tags: [AdminSecurity]
      summary: 查询管理员与角色分配
      description: 返回管理员、角色、权限聚合结果；以数据库实时角色权限为准
      responses:
        '200':
          description: OK
  /admin/security/roles:
    get:
      tags: [AdminSecurity]
      summary: 查询角色列表
      description: 返回角色、权限集合和已分配管理员数量
      responses:
        '200':
          description: OK
  /admin/security/permissions:
    get:
      tags: [AdminSecurity]
      summary: 查询权限列表
      description: 返回可配置权限码和关联角色数量
      responses:
        '200':
          description: OK
  /admin/security/admin-users/{adminUserId}/roles:
    post:
      tags: [AdminSecurity]
      summary: 覆盖式分配管理员角色
      description: 角色分配后权限即时生效，并写入 admin_operation_log、audit_log、hash_record
      parameters:
        - in: path
          name: adminUserId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /admin/security/roles/{roleId}/permissions:
    post:
      tags: [AdminSecurity]
      summary: 覆盖式分配角色权限
      description: 权限分配后接口级校验立即使用数据库最新权限结果
      parameters:
        - in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /admin/leaderboard/rule:
    post:
      tags: [AdminLeaderboard]
      summary: 切换排行榜规则
      description: 切换当前排行榜规则配置，支持黄金克数排序和总资产排序，并写入治理审计日志；需要排行榜规则更新权限
      responses:
        '200':
          description: OK
  /admin/leaderboard/rebuild:
    post:
      tags: [AdminLeaderboard]
      summary: 触发排行榜重排
      description: 创建新的排行榜重排任务并持久化最新快照，任务状态按 rebuilding/synced/failed 流转；需要排行榜重建权限
      responses:
        '200':
          description: OK
  /admin/leaderboard/retry-sync:
    post:
      tags: [AdminLeaderboard]
      summary: 异常重试与状态修复
      description: 针对异常排行榜快照重新生成同步结果，并写入 adminOperationLog、auditLog、hashRecord；需要排行榜异常修复权限
      responses:
        '200':
          description: OK
  /admin/trades/overview:
    get:
      tags: [AdminTrades]
      summary: 查询交易总览与当前交易状态
      description: 返回当前开闭盘状态、当前时段、下次开盘时间、最后同步时间和待同步数量
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTradeSessionStatus'
  /admin/trades/pause:
    post:
      tags: [AdminTrades]
      summary: 后台停盘
      description: 仅管理员可调用，停盘操作会写入 admin_operation_log、audit_log、hash_record，并校验停盘权限
      responses:
        '200':
          description: OK
  /admin/trades/resume:
    post:
      tags: [AdminTrades]
      summary: 后台恢复交易
      description: 仅管理员可调用，恢复操作会写入 admin_operation_log、audit_log、hash_record，并校验恢复交易权限
      responses:
        '200':
          description: OK
  /admin/users/{uid}/freeze:
    post:
      tags: [AdminRisk]
      summary: 冻结用户
      description: 仅管理员可调用，冻结后交易与提现流程应按既有规则进行拦截并保留审计留痕；需要冻结用户权限
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /admin/users/{uid}/unfreeze:
    post:
      tags: [AdminRisk]
      summary: 解冻用户
      description: 仅管理员可调用，恢复用户正常交易资格并保留审计留痕；需要解冻用户权限
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /admin/risk/rules:
    get:
      tags: [AdminRisk]
      summary: 查询风控规则配置
      description: 返回提现拦截开关、单笔提现上限、日提现上限、异常交易阈值和黑名单 UID 列表
      responses:
        '200':
          description: OK
    post:
      tags: [AdminRisk]
      summary: 更新风控规则配置
      description: 覆盖式更新风控规则和黑名单 UID 列表，并写入 admin_operation_log、audit_log、hash_record
      responses:
        '200':
          description: OK
  /admin/audit/trace/{traceId}:
    get:
      tags: [AdminAudit]
      summary: 查询 trace 全链路详情
      description: 返回资金、交易、风控、后台操作、hash、syncStatus 等全链路节点
      parameters:
        - in: path
          name: traceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuditTraceDetail'
  /admin/audit/trace/{traceId}/verify-hash:
    post:
      tags: [AdminAudit]
      summary: 校验 trace 哈希完整性
      description: 校验 trace 下 hash_record 是否通过校验，并写入 admin_operation_log、audit_log、hash_record
      parameters:
        - in: path
          name: traceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuditTraceVerify'
  /admin/audit/trace/{traceId}/export:
    get:
      tags: [AdminAudit]
      summary: 导出 trace 详情
      description: 支持 csv/json 导出，返回文件元信息与导出内容，并写入 admin_operation_log、audit_log、hash_record
      parameters:
        - in: path
          name: traceId
          required: true
          schema:
            type: string
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [csv, json]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuditTraceExport'
  /admin/audit/traces/{traceId}:
    get:
      tags: [AdminAudit]
      summary: 按 traceId 查询全链路追踪
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuditTrace'
  /admin/audit/hash-records:
    get:
      tags: [AdminAudit]
      summary: 查询哈希记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHashRecordList'
  /admin/reports/generate:
    post:
      tags: [AdminReports]
      summary: 生成报表任务
      description: 创建报表任务并持久化导出产物，生成过程写入 admin_operation_log、audit_log、hash_record
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportJob'
  /admin/reports/jobs:
    get:
      tags: [AdminReports]
      summary: 查询报表任务列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportJobList'
  /admin/reports/jobs/{jobId}:
    get:
      tags: [AdminReports]
      summary: 查询报表任务详情
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportJobDetail'
  /admin/reports/jobs/{jobId}/export:
    post:
      tags: [AdminReports]
      summary: 导出报表任务产物
      description: 支持 csv 导出；excel 当前为占位产物，导出操作写入 admin_operation_log、audit_log、hash_record
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportArtifact'
  /admin/reports/templates:
    post:
      tags: [AdminReports]
      summary: 保存报表模板
      description: 保存可复用报表模板，并写入 admin_operation_log、audit_log、hash_record
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportTemplate'
    get:
      tags: [AdminReports]
      summary: 查询报表模板
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportTemplateList'
components:
  schemas:
    UserSummary:
      type: object
      properties:
        userId:
          type: string
        uid:
          type: integer
        sequenceNo:
          type: integer
    AssetOverview:
      type: object
      properties:
        uid:
          type: integer
        tentativeAsset:
          type: number
        withdrawFrozenAmount:
          type: number
        cashAsset:
          type: number
        totalAsset:
          type: number
    RechargeOrder:
      type: object
      properties:
        orderId:
          type: string
        channel:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        traceId:
          type: string
        autoSettleAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
    WithdrawOrder:
      type: object
      properties:
        orderId:
          type: string
        queueNo:
          type: integer
          description: 提现队列号，按提交时间递增
        uid:
          type: integer
        amount:
          type: number
        frozenAmount:
          type: number
        status:
          type: string
          enum: [pending_review, transfer_processing, completed, rejected]
        submittedAt:
          type: string
          format: date-time
        freezeAppliedAt:
          type: string
          format: date-time
        confirmCompletedAt:
          type: string
          format: date-time
        alertStatus:
          type: string
          enum: [ringing, muted, stopped]
        alertStoppedAt:
          type: string
          format: date-time
        alertStopReason:
          type: string
          enum: [open_detail, manual_mute]
        wechatQrCodeUrl:
          type: string
        alipayQrCodeUrl:
          type: string
        bankCardNo:
          type: string
        traceId:
          type: string
    ManualFundAction:
      type: object
      properties:
        uid:
          type: string
        traceId:
          type: string
        amount:
          type: number
        direction:
          type: string
          enum: [increase, decrease]
        reason:
          type: string
        latestBalance:
          type: object
          properties:
            tentativeAsset:
              type: number
            cashAsset:
              type: number
            totalAsset:
              type: number
            withdrawFrozenAmount:
              type: number
    TradeOrder:
      type: object
      properties:
        tradeNo:
          type: string
        tradeType:
          type: string
          enum: [buy, sell]
        uid:
          type: integer
        amount:
          type: number
        grams:
          type: number
        status:
          type: string
        syncStatus:
          type: string
        syncLagMs:
          type: integer
          description: 交易同步延迟毫秒，目标不超过 1000ms
        traceId:
          type: string
        clientRequestId:
          type: string
          description: 可选客户端幂等请求号；未传请求头 `Idempotency-Key` 时可作为幂等键使用
    TradeSessionStatus:
      type: object
      properties:
        sessionSource:
          type: string
          enum: [SGE_OFFICIAL]
        timezone:
          type: string
          example: Asia/Shanghai
        currentSessionStatus:
          type: string
          enum: [open, closed]
        currentWindow:
          type: string
        nextOpenAt:
          type: string
          format: date-time
        nextCloseAt:
          type: string
          format: date-time
        isHoliday:
          type: boolean
        holidayName:
          type: string
        syncStatus:
          type: string
    PaymentQr:
      type: object
      properties:
        uid:
          type: string
        displayName:
          type: string
        qrPayload:
          type: string
        slogan:
          type: string
    PaymentTransfer:
      type: object
      properties:
        orderId:
          type: string
        traceId:
          type: string
        payerUid:
          type: string
        payeeUid:
          type: string
        amount:
          type: number
        scene:
          type: string
          enum: [user, merchant]
        status:
          type: string
          enum: [completed, failed]
        remark:
          type: string
        payerBalance:
          type: object
        payeeBalance:
          type: object
    PaymentRecord:
      type: object
      properties:
        orderId:
          type: string
        traceId:
          type: string
        direction:
          type: string
        counterpartyUid:
          type: string
        counterpartyName:
          type: string
        amount:
          type: number
        scene:
          type: string
        status:
          type: string
        remark:
          type: string
        createdAt:
          type: string
    AdminPaymentRow:
      type: object
      properties:
        orderId:
          type: string
        traceId:
          type: string
        payerUid:
          type: string
        payeeUid:
          type: string
        amount:
          type: number
        scene:
          type: string
        status:
          type: string
        createdAt:
          type: string
    AdminPaymentOverview:
      type: object
      properties:
        totalCount:
          type: integer
        totalAmount:
          type: number
        exceptionCount:
          type: integer
        summaryText:
          type: string
        trend24h:
          type: array
          items:
            type: object
    DashboardOverview:
      type: object
      properties:
        pendingAuditCount:
          type: integer
        frozenUserCount:
          type: integer
        goldReferencePrice:
          type: number
        tradingStatus:
          type: string
        syncDelay:
          type: number
        withdrawAlertRingingCount:
          type: integer
        pollingEnabled:
          type: boolean
    Notice:
      type: object
      properties:
        noticeId:
          type: string
        title:
          type: string
        content:
          type: string
        pollingEnabled:
          type: boolean
    HashRecord:
      type: object
      properties:
        hashValue:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 64 位哈希值
        traceId:
          type: string
        uid:
          type: integer
        chainSyncStatus:
          type: string
    AuditTraceNode:
      type: object
      properties:
        nodeType:
          type: string
        module:
          type: string
        action:
          type: string
        operator:
          type: string
        referenceType:
          type: string
        referenceId:
          type: string
        syncStatus:
          type: string
        createdAt:
          type: string
    AuditTraceDetail:
      type: object
      properties:
        traceId:
          type: string
        summary:
          type: object
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AuditTraceNode'
        hashItems:
          type: array
          items:
            type: object
    AuditTraceVerify:
      type: object
      properties:
        traceId:
          type: string
        passed:
          type: boolean
        failedCount:
          type: integer
        failedItems:
          type: array
          items:
            type: object
        totalCount:
          type: integer
        verifiedAt:
          type: string
        traceOperationId:
          type: string
    AuditTraceExport:
      type: object
      properties:
        traceId:
          type: string
        format:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        exportedAt:
          type: string
        totalNodes:
          type: integer
        content:
          type: string
        traceOperationId:
          type: string
    ReportJob:
      type: object
      properties:
        jobId:
          type: string
        traceId:
          type: string
        reportType:
          type: string
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        rowCount:
          type: integer
        format:
          type: string
    ReportArtifact:
      type: object
      properties:
        jobId:
          type: string
        artifactId:
          type: string
        traceId:
          type: string
        format:
          type: string
          enum: [csv, excel]
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        rowCount:
          type: integer
        content:
          type: string
    ReportTemplate:
      type: object
      properties:
        templateId:
          type: string
        traceId:
          type: string
        name:
          type: string
        reportType:
          type: string
        filters:
          type: object
        defaultFormat:
          type: string
          enum: [csv, excel]
    ApiResponseMessage:
